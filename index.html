<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Orion OS - Pro Hub</title>
    
    <link rel="manifest" href="manifest.json">
    
    <style>
        /* PS5 Pro Aesthetic: Matte darks, crisp whites, three-stripe motif, glass panels */
        :root {
            --pro-bg: #050505;
            --pro-surface: #111111;
            --pro-accent: #ffffff;
            --pro-stripe: rgba(255, 255, 255, 0.03);
            --pro-text: #e0e0e0;
            --pro-blue: #00439c; 
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; user-select: none; }
        
        body {
            background-color: var(--pro-bg);
            color: var(--pro-text);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* PS5 Pro Signature Stripes */
        .pro-stripes {
            position: absolute; top: 50%; width: 100%; height: 120px;
            transform: translateY(-50%);
            background: linear-gradient(to bottom, transparent 20%, var(--pro-stripe) 20%, var(--pro-stripe) 30%, transparent 30%, transparent 45%, var(--pro-stripe) 45%, var(--pro-stripe) 55%, transparent 55%, transparent 70%, var(--pro-stripe) 70%, var(--pro-stripe) 80%, transparent 80%);
            z-index: 0; pointer-events: none;
        }

        #app-container { position: relative; z-index: 10; height: 100%; display: flex; flex-direction: column; }

        /* Sleek Boot / Auth Screen Overlay */
        #auth-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--pro-bg); z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        .auth-card {
            background: var(--pro-surface); padding: 50px; border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1); text-align: center; width: 380px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.8);
        }

        .auth-card h1 { color: var(--pro-accent); font-size: 32px; letter-spacing: 2px; margin-bottom: 5px; font-weight: 300; }
        .auth-card p { font-size: 12px; color: #666; margin-bottom: 25px; letter-spacing: 1px; }
        .auth-card input { width: 100%; padding: 15px; margin-bottom: 15px; background: #1a1a1a; border: 1px solid #333; color: white; border-radius: 6px; outline: none; transition: 0.3s; }
        .auth-card input:focus { border-color: var(--pro-accent); }
        .auth-card button { width: 100%; padding: 15px; background: var(--pro-accent); color: black; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; transition: 0.2s; }
        .auth-card button:hover { background: #d0d0d0; }

        /* Main Hub Header */
        .hub-header {
            display: flex; justify-content: space-between; align-items: center; padding: 30px 50px;
        }

        .hub-nav { display: flex; gap: 30px; font-size: 18px; font-weight: 500; }
        .hub-nav span { color: #666; cursor: pointer; transition: 0.2s; }
        .hub-nav span.active { color: var(--pro-accent); font-weight: 700; border-bottom: 2px solid var(--pro-accent); padding-bottom: 5px; }
        .hub-nav span:hover:not(.active) { color: white; }

        .sys-widgets { display: flex; gap: 20px; align-items: center; font-size: 13px; color: #888; font-weight: bold; }
        .install-btn { background: rgba(255,255,255,0.1); color: white; padding: 8px 16px; border-radius: 20px; cursor: pointer; border: 1px solid rgba(255,255,255,0.2); display: none; }
        
        .play-btn { background: var(--pro-accent); color: black; padding: 8px 24px; border-radius: 20px; font-weight: bold; cursor: pointer; border: none; }
        .play-btn:hover { background: #d0d0d0; }

        /* Chat UI Layout */
        .chat-container {
            display: grid; grid-template-columns: 280px 1fr; flex: 1; padding: 0 50px 30px 50px; gap: 20px;
        }

        .sidebar, .chat-area {
            background: rgba(17, 17, 17, 0.7); backdrop-filter: blur(25px);
            border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); padding: 20px;
        }
        
        .sidebar { display: flex; flex-direction: column; gap: 15px; }
        .chat-area { display: flex; flex-direction: column; }

        .channel { padding: 12px 15px; border-radius: 8px; cursor: pointer; color: #888; font-size: 14px; transition: 0.2s; }
        .channel:hover { background: rgba(255,255,255,0.05); color: var(--pro-accent); }
        .channel.active { background: rgba(255,255,255,0.1); color: var(--pro-accent); font-weight: bold; }

        .btn-new-group { background: transparent; color: var(--pro-accent); border: 1px solid rgba(255,255,255,0.2); padding: 10px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .btn-new-group:hover { background: rgba(255,255,255,0.1); }

        .messages { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; margin-bottom: 20px; padding-right: 10px; }
        .messages::-webkit-scrollbar { width: 5px; }
        .messages::-webkit-scrollbar-thumb { background: #333; border-radius: 5px; }

        .msg-bubble { background: #1a1a1a; padding: 15px; border-radius: 10px; font-size: 14px; max-width: 80%; border: 1px solid rgba(255,255,255,0.03); }
        .msg-author { font-size: 11px; color: #aaa; font-weight: bold; margin-bottom: 5px; letter-spacing: 1px; }

        .chat-input-box { display: flex; gap: 10px; }
        .chat-input-box input { flex: 1; padding: 15px; background: #111; border: 1px solid #333; border-radius: 8px; color: white; outline: none; }
        .chat-input-box button { padding: 0 25px; background: var(--pro-accent); color: black; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; }

        /* Terminal Overlay */
        #terminal-ui {
            position: fixed; bottom: 0; left: 0; width: 100%; height: 45vh;
            background: rgba(5,5,5,0.98); border-top: 1px solid #333;
            color: #fff; font-family: 'Courier New', monospace; padding: 25px;
            display: none; z-index: 50000; overflow-y: auto; box-shadow: 0 -10px 50px rgba(0,0,0,0.9);
        }
        .term-input { background: transparent; border: none; color: #fff; outline: none; width: 80%; font-family: inherit; font-size: 15px; margin-left: 10px; }
    </style>
</head>
<body>

    <div class="pro-stripes"></div>

    <!-- Login/Boot Screen -->
    <div id="auth-screen">
        <div class="auth-card">
            <h1>ORION OS</h1>
            <p>PRO EDITION</p>
            <input type="text" id="auth-username" placeholder="Username" onkeydown="if(event.key==='Enter') login()">
            <input type="password" id="auth-password" placeholder="Password (Optional)" onkeydown="if(event.key==='Enter') login()">
            <button type="button" onclick="login()">BOOT SYSTEM</button>
        </div>
    </div>

    <!-- Main OS Interface -->
    <div id="app-container">
        <header class="hub-header">
            <div class="hub-nav">
                <span class="active">Communication</span>
                <span onclick="window.location.href='games.html'">Games Library</span>
            </div>
            
            <div class="sys-widgets">
                <span id="active-user">User: Offline</span>
                <span>Network: SECURE</span>
                <button class="install-btn" id="install-btn" type="button">Install OS App</button>
                <button class="play-btn" type="button" onclick="window.location.href='games.html'">Launch Games</button>
            </div>
        </header>

        <div class="chat-container">
            <div class="sidebar">
                <div style="font-size: 11px; color: #666; font-weight: bold; text-transform: uppercase;">Channels</div>
                <div id="channel-list">
                    <div class="channel active" onclick="switchChannel('# public-main', this)"># public-main</div>
                    <div class="channel" onclick="switchChannel('# general-gaming', this)"># general-gaming</div>
                    <div class="channel" onclick="switchChannel('@ DMs', this)">@ Direct Messages</div>
                </div>
                <button class="btn-new-group" type="button" onclick="createGroup()">+ Create # Group</button>
            </div>

            <div class="chat-area">
                <h2 id="current-channel" style="font-size: 20px; font-weight: 500; margin-bottom: 20px;"># public-main</h2>
                <div class="messages" id="chat-history">
                    <div class="msg-bubble">
                        <div class="msg-author">System Guard</div>
                        Welcome to Orion OS. Chat filters are active. Keep it clean and respectful.
                    </div>
                </div>
                <div class="chat-input-box">
                    <input type="text" id="chat-input" placeholder="Message # public-main..." onkeydown="if(event.key==='Enter') sendMessage()">
                    <button type="button" onclick="sendMessage()">Send</button>
                </div>
            </div>
        </div>
    </div>

    <div id="terminal-ui" onclick="document.getElementById('term-input').focus()"></div>

    <!-- JavaScript Logic -->
    <script>
        let currentUser = "";

        function login() {
            const usernameInput = document.getElementById('auth-username').value.trim();
            
            if (!usernameInput) {
                alert("Please enter a username!");
                return;
            }

            currentUser = usernameInput;

            // Update user tag in header
            document.getElementById('active-user').innerText = `User: ${currentUser}`;

            // Fade out and remove the auth screen overlay
            const authScreen = document.getElementById('auth-screen');
            authScreen.style.opacity = '0';
            authScreen.style.transition = 'opacity 0.4s ease';
            
            setTimeout(() => {
                authScreen.style.display = 'none';
            }, 400);
        }

        function switchChannel(channelName, element) {
            document.querySelectorAll('.channel').forEach(c => c.classList.remove('active'));
            element.classList.add('active');
            document.getElementById('current-channel').innerText = channelName;
            document.getElementById('chat-input').placeholder = `Message ${channelName}...`;
        }

        function sendMessage() {
            const input = document.getElementById('chat-input');
            const messageText = input.value.trim();

            if (!messageText) return;

            const chatHistory = document.getElementById('chat-history');
            const msgBubble = document.createElement('div');
            msgBubble.className = 'msg-bubble';
            msgBubble.innerHTML = `
                <div class="msg-author">${currentUser || 'Anonymous'}</div>
                <div>${messageText}</div>
            `;

            chatHistory.appendChild(msgBubble);
            input.value = '';
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }

        function createGroup() {
            const groupName = prompt("Enter new channel name:");
            if (groupName) {
                const channelList = document.getElementById('channel-list');
                const newChannel = document.createElement('div');
                newChannel.className = 'channel';
                const formattedName = groupName.startsWith('#') ? groupName : `# ${groupName}`;
                newChannel.innerText = formattedName;
                newChannel.onclick = function() { switchChannel(formattedName, this); };
                channelList.appendChild(newChannel);
            }
        }
    </script>
</body>
</html>
