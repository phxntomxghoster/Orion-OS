<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orion OS - Next Gen</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    
    body { 
      background: #0a0a0a; 
      color: #fff; 
      height: 100vh; 
      overflow: hidden; 
      display: flex; 
      flex-direction: column; 
    }

    /* Dynamic Background */
    #bg-layer {
      position: absolute;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: radial-gradient(circle at top left, #2b3a4a, #0a0c10);
      background-size: cover;
      background-position: center;
      filter: blur(15px) brightness(0.6);
      transition: background 0.8s ease, filter 0.8s ease;
      z-index: -1;
    }

    /* Top Left Status Bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 40px 60px;
      z-index: 10;
    }

    .nav-tabs { display: flex; gap: 30px; font-size: 20px; font-weight: 500; }
    .nav-tabs span { cursor: pointer; color: rgba(255,255,255,0.5); transition: 0.3s; padding-bottom: 5px; }
    .nav-tabs span.active { color: #fff; border-bottom: 2px solid #fff; }

    /* Top Right Profile & Time */
    .system-status { display: flex; align-items: center; gap: 20px; font-size: 18px; }
    .profile-pic { width: 40px; height: 40px; background: #00f0ff; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-weight: bold; color: #000; box-shadow: 0 0 15px rgba(0,240,255,0.4); }

    /* Main Content (Horizontal PS5 Scroll) */
    .main-content { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; padding: 0 60px 80px 60px; z-index: 10; }
    
    .game-info { margin-bottom: 20px; opacity: 1; transition: opacity 0.3s; }
    .game-logo-text { font-size: 42px; font-weight: 700; text-shadow: 2px 2px 20px rgba(0,0,0,0.8); margin-bottom: 8px; letter-spacing: 1px; }
    .game-meta { font-size: 14px; color: rgba(255,255,255,0.7); display: flex; gap: 15px; }

    .game-carousel { 
      display: flex; 
      gap: 15px; 
      align-items: flex-end; 
      height: 250px;
    }

    /* PS5 Style Expanding Cards */
    .game-card { 
      width: 120px; 
      height: 120px; 
      border-radius: 20px; 
      background-size: cover;
      background-position: center;
      cursor: pointer; 
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      border: 2px solid transparent;
      box-shadow: 0 10px 20px rgba(0,0,0,0.3);
      filter: brightness(0.7);
    }

    .game-card:hover { filter: brightness(1); }

    /* The Active Focused Game */
    .game-card.active { 
      width: 220px; 
      height: 220px; 
      border: 3px solid #fff; 
      filter: brightness(1);
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      transform: translateY(-10px);
    }
  </style>
</head>
<body>

  <!-- Dynamic blurred background -->
  <div id="bg-layer"></div>

  <div class="top-bar">
    <div class="nav-tabs">
      <span class="active">Games</span>
      <span onclick="playHoverSound()">App Store</span>
    </div>
    <div class="system-status">
      <span>( O ) ORION</span>
      <span id="clock">12:00 PM</span>
      <div class="profile-pic">P</div>
    </div>
  </div>

  <div class="main-content">
    <div class="game-info" id="game-info">
      <div class="game-logo-text" id="game-title">Select a Game</div>
      <div class="game-meta">
        <span>PS5 Version</span> • <span id="game-status">Ready to Play</span> • <span>Role: Slayer</span>
      </div>
    </div>

    <div class="game-carousel">
      <!-- Game Cards -->
      <div class="game-card active" data-title="Fallin Bomb Shell" data-bg="https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=1000&q=80" style="background-image: url('https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=400&q=80');"></div>
      
      <div class="game-card" data-title="Grand Crime Drive VI" data-bg="https://images.unsplash.com/photo-1605901309584-818e25960b8f?auto=format&fit=crop&w=1000&q=80" style="background-image: url('https://images.unsplash.com/photo-1605901309584-818e25960b8f?auto=format&fit=crop&w=400&q=80');"></div>
      
      <div class="game-card" data-title="Borlox" data-bg="https://images.unsplash.com/photo-1550745165-9bc0b252726f?auto=format&fit=crop&w=1000&q=80" style="background-image: url('https://images.unsplash.com/photo-1550745165-9bc0b252726f?auto=format&fit=crop&w=400&q=80');"></div>
      
      <div class="game-card" data-title="NightFort" data-bg="https://images.unsplash.com/photo-1538481199705-c710c4e965fc?auto=format&fit=crop&w=1000&q=80" style="background-image: url('https://images.unsplash.com/photo-1538481199705-c710c4e965fc?auto=format&fit=crop&w=400&q=80');"></div>
    </div>
  </div>

  <script>
    // --- AUDIO SYNTHESIZER (No MP3s needed, pure browser sound) ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    // 1. Hover Sound: Soft, quick, low PS5 'thud'
    function playHoverSound() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      
      osc.type = 'sine';
      osc.frequency.setValueAtTime(150, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.1); // Pitch drop
      
      gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1); // Quick fade
      
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.1);
    }

    // 2. Select Sound: Crisp next-gen chime (Shifted up to an 'A' note)
    function playSelectSound() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      
      osc.type = 'sine';
      osc.frequency.setValueAtTime(880, audioCtx.currentTime); // 880Hz = A5 note
      
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.6); // Long smooth tail
      
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.6);
    }

    // --- UI LOGIC ---
    const cards = document.querySelectorAll('.game-card');
    const bgLayer = document.getElementById('bg-layer');
    const titleText = document.getElementById('game-title');
    const infoBox = document.getElementById('game-info');

    // Initialize first background
    bgLayer.style.backgroundImage = `url('${cards[0].getAttribute('data-bg')}')`;

    cards.forEach(card => {
      // Hover event
      card.addEventListener('mouseenter', () => {
        if (!card.classList.contains('active')) {
          playHoverSound();
          
          // Remove active from all
          cards.forEach(c => c.classList.remove('active'));
          // Add active to current
          card.classList.add('active');
          
          // Update Text & Background
          infoBox.style.opacity = 0;
          setTimeout(() => {
            titleText.innerText = card.getAttribute('data-title');
            bgLayer.style.backgroundImage = `url('${card.getAttribute('data-bg')}')`;
            infoBox.style.opacity = 1;
          }, 150);
        }
      });

      // Click event
      card.addEventListener('click', () => {
        playSelectSound();
        // Here you would trigger the game load sequence
        document.getElementById('game-status').innerText = 'Starting application...';
      });
    });

    // Simple Clock
    setInterval(() => {
      const now = new Date();
      document.getElementById('clock').innerText = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
    }, 1000);

    // Hardcoded Panic Keybind (Ctrl + Opt + Cmd + H)
    window.addEventListener('keydown', (e) => {
      if (e.key.toLowerCase() === 'h' && e.ctrlKey && e.altKey && e.metaKey) {
        e.preventDefault();
        window.location.href = 'Panic.html'; 
      }
    });
  </script>
</body>
</html>
