<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grand Crime Drive VI - Engine Core</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #87CEEB; /* Sky blue */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #ui-layer {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            z-index: 10;
        }
        #character-name {
            font-size: 36px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }
        #instructions {
            font-size: 14px;
            color: #ffcc00;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 10px;
            background: white;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            mix-blend-mode: difference;
            z-index: 10;
        }
    </style>
</head>
<body>

    <!-- UI Overlay -->
    <div id="ui-layer">
        <div id="character-name">Jace</div>
        <div id="instructions">WASD to Move | 1, 2, 3, 4 to Switch Characters</div>
    </div>
    <div id="crosshair"></div>

    <!-- Import Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // ==========================================
        // GCD VI - CORE ENGINE SETUP
        // ==========================================

        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x87CEEB, 0.002); // Distance fog for the city

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // ==========================================
        // LIGHTING & ENVIRONMENT
        // ==========================================
        
        const ambientLight = new THREE.AmbientLight(0x404040, 0.6);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffffff, 0.8);
        sunLight.position.set(100, 200, 50);
        sunLight.castShadow = true;
        sunLight.shadow.camera.left = -100;
        sunLight.shadow.camera.right = 100;
        sunLight.shadow.camera.top = 100;
        sunLight.shadow.camera.bottom = -100;
        scene.add(sunLight);

        // Ground (Lakefront City Concrete)
        const groundGeo = new THREE.PlaneGeometry(1000, 1000);
        const groundMat = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.8 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // ==========================================
        // CITY GENERATOR (Procedural Cleveland Map)
        // ==========================================
        
        // This generates placeholder blocks. Later, you replace these with loaded 3D models!
        const buildingGeo = new THREE.BoxGeometry(1, 1, 1);
        const buildingMat = new THREE.MeshStandardMaterial({ color: 0x555555 });

        for (let i = 0; i < 300; i++) {
            const building = new THREE.Mesh(buildingGeo, buildingMat);
            
            // Random sizes for skyscrapers and small shops
            const width = Math.random() * 10 + 5;
            const height = Math.random() * 40 + 10;
            const depth = Math.random() * 10 + 5;
            
            building.scale.set(width, height, depth);
            
            // Random positions across the massive map
            building.position.x = (Math.random() - 0.5) * 400;
            building.position.z = (Math.random() - 0.5) * 400;
            building.position.y = height / 2;
            
            building.castShadow = true;
            building.receiveShadow = true;
            
            // Create a simple street grid gap
            if (Math.abs(building.position.x) > 20 && Math.abs(building.position.z) > 20) {
                scene.add(building);
            }
        }

        // ==========================================
        // CHARACTER SYSTEM & CONTROLLER
        // ==========================================
        
        const characters = {
            1: { name: "Jace", color: 0xff0000, speed: 0.4 }, // Red, Fast
            2: { name: "Emily", color: 0x00ff00, speed: 0.35 }, // Green, Nimble
            3: { name: "Amelia", color: 0x0000ff, speed: 0.3 }, // Blue, Tactical
            4: { name: "James", color: 0xffcc00, speed: 0.25 }  // Gold, Heavy tank
        };

        let currentPlayer = characters[1];

        // Player Mesh (Placeholder for real 3D models)
        const playerGeo = new THREE.BoxGeometry(2, 4, 2);
        let playerMat = new THREE.MeshStandardMaterial({ color: currentPlayer.color });
        const player = new THREE.Mesh(playerGeo, playerMat);
        player.position.y = 2;
        player.castShadow = true;
        scene.add(player);

        // Camera setup (3rd Person Follow)
        const cameraOffset = new THREE.Vector3(0, 10, -15);

        // ==========================================
        // INPUT CONTROLS
        // ==========================================
        
        const keys = { w: false, a: false, s: false, d: false };

        window.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            if (keys.hasOwnProperty(key)) keys[key] = true;

            // Character Switching Logic
            if (['1', '2', '3', '4'].includes(key)) {
                switchCharacter(parseInt(key));
            }
        });

        window.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            if (keys.hasOwnProperty(key)) keys[key] = false;
        });

        function switchCharacter(id) {
            currentPlayer = characters[id];
            
            // Update UI
            document.getElementById('character-name').innerText = currentPlayer.name;
            document.getElementById('character-name').style.color = '#' + currentPlayer.color.toString(16).padStart(6, '0');
            
            // Update Player Model Color (This is where you'd swap the actual 3D mesh later)
            player.material.color.setHex(currentPlayer.color);
            
            console.log(`Switched to ${currentPlayer.name}.`); // Little debug log for us
        }

        // ==========================================
        // GAME LOOP (Physics & Rendering)
        // ==========================================
        
        function animate() {
            requestAnimationFrame(animate);

            // Basic Movement Logic
            if (keys.w) player.translateZ(currentPlayer.speed);
            if (keys.s) player.translateZ(-currentPlayer.speed);
            if (keys.a) player.rotation.y += 0.05;
            if (keys.d) player.rotation.y -= 0.05;

            // Update Camera to follow player (3rd Person view)
            const relativeCameraOffset = cameraOffset.clone().applyMatrix4(player.matrixWorld);
            camera.position.lerp(relativeCameraOffset, 0.1); // Smooth camera tracking
            camera.lookAt(player.position);

            renderer.render(scene, camera);
        }

        // Handle Window Resizing
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate(); // Kick off the engine
    </script>
</body>
</html>
